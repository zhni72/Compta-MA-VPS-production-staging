<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — {{ app_name }}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <header>
      <h1>{{ app_name }}</h1>
      <p>Comptabilité marocaine (CGNC) &middot; Facturation &middot; TVA &middot; Paie</p>
    </header>
    <div class="body">
      {% if msg %}<div class="alert alert-{{ level }}">{{ msg }}</div>{% endif %}
      <form method="post" action="/connexion">
        <input type="hidden" name="next" value="{{ next_url or '/' }}">
        <div class="field">
          <label for="email" class="required">Adresse e-mail</label>
          <input type="email" id="email" name="email" value="{{ email or '' }}"
                 required autofocus autocomplete="username" placeholder="admin@compta.ma">
        </div>
        <div class="field">
          <label for="password" class="required">Mot de passe</label>
          <input type="password" id="password" name="password" required
                 autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary">Se connecter</button>
      </form>
    </div>
    <footer>
      Aucun compte ? L'amorçage crée un administrateur :
      <code>python -m app.db.seed</code>
    </footer>
  </div>
</div>
</body>
</html>
